name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    name: pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12"]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Show installed package versions (diagnostic)
        run: |
          python -c "import pymc; print('pymc', pymc.__version__)" || true
          python -c "import hmmlearn; print('hmmlearn', hmmlearn.__version__)" || true
          python -c "import lifelines; print('lifelines', lifelines.__version__)" || true
          python -c "import xgboost; print('xgboost', xgboost.__version__)" || true
          python -c "import lightgbm; print('lightgbm', lightgbm.__version__)" || true

      - name: Run pytest
        env:
          PYTHONIOENCODING: utf-8
        run: pytest -q --tb=short
